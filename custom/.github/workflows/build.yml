name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build launcher (private)
        run: >
          dotnet build "tools/pclce/PCL-CE-dev/Plain Craft Launcher 2/Plain Craft Launcher 2.csproj"
          -c Release -p:Platform=x64 -p:LangVersion=14

      - name: Build launcher (public release, license requirement)
        run: >
          dotnet build "tools/pclce/PCL-CE-dev/Plain Craft Launcher 2/Plain Craft Launcher 2.csproj"
          -c Release -p:Platform=x64 -p:LangVersion=14 -p:PublicRelease=true

      - name: Test core
        run: >
          dotnet test "tools/pclce/PCL-CE-dev/PCL.Core.Test/PCL.Core.Test.csproj"
          -c Release -p:Platform=x64 -p:LangVersion=14 --no-restore
