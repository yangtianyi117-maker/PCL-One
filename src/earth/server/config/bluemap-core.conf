# BlueMap core.conf (subset). Keep the webserver bound to localhost until the
# map license holder grants written permission for a public web map.
accept-download: true
data: "bluemap"
render-thread-count: 2
metrics: false
webserver:
  enabled: true
  bind: "127.0.0.1"
  port: 8100
maps:
  - id: "world"
    name: "Earth 1:1000"
    world: "Earth1000"
    dimension: "minecraft:overworld"
    storage: "bluemap"
